<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>K-Life | Login</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <link rel="stylesheet" href="style.css">
    </head>

    <body class="bg-light">

        <main class="container py-5">

            <div class="row justify-content-center align-items-center min-vh-100">

                <div class="col-lg-8 col-xl-7">

                    <div class="card auth-card shadow-sm border-0">

                        <div class="row g-0">

                            <section class="col-md-5 intro-section text-white p-4">

                                <h1 class="fw-bold">K-Life</h1>

                                <p class="mt-4">A life you can experience and realize with just reading and make you take action.</p>

                                <div class="mt-4">
                                    <p>✓ Physical Health</p>
                                    <p>✓ Mental State</p>
                                    <p>✓ Social Ties</p>
                                </div>

                            </section>

                            <section class="col-md-7 p-4 p-lg-5">

                                <ul class="nav nav-pills nav-fill mb-4">

                                    <li class="nav-item">
                                        <button class="nav-link active"
                                                data-bs-toggle="pill"
                                                data-bs-target="#login">
                                            Login
                                        </button>
                                    </li>

                                    <li class="nav-item">
                                        <button class="nav-link"
                                                data-bs-toggle="pill"
                                                data-bs-target="#signup">
                                            Sign Up
                                        </button>
                                    </li>

                                </ul>


                                <div class="tab-content">

                                    <div class="tab-pane fade show active" id="login">

                                        <h2 class="h4 fw-bold">Welcome Back</h2>

                                        <p class="text-muted">Log in to continue.</p>

                                        <form>

                                            <label class="form-label">Email or Username</label>

                                            <input type="text"
                                                class="form-control mb-3"
                                                placeholder="Enter email or username"
                                                required>

                                            <label class="form-label">Password</label>

                                            <input type="password"
                                                class="form-control mb-3"
                                                placeholder="Enter password"
                                                required>

                                            <div class="form-check mb-3">

                                                <input class="form-check-input"
                                                    type="checkbox"
                                                    id="remember">

                                                <label class="form-check-label" for="remember">Remember me</label>

                                            </div>

                                            <a href="landing.html"
                                            class="btn btn-primary w-100">
                                                Log In</a>

                                        </form>

                                        <p class="text-center mt-3 small">
                                            Don't have an account?
                                            <button class="btn btn-link btn-sm p-0"
                                                    data-bs-toggle="pill"
                                                    data-bs-target="#signup">
                                                Sign Up
                                            </button>
                                        </p>

                                    </div>

                                    <div class="tab-pane fade" id="signup">

                                        <h2 class="h4 fw-bold">Create Account</h2>

                                        <p class="text-muted">Fill out the form below.</p>

                                        <form>

                                            <div class="row">

                                                <div class="col-md-6 mb-3">
                                                    <label class="form-label">
                                                        First Name
                                                    </label>

                                                    <input type="text"
                                                        class="form-control"
                                                        required>
                                                </div>

                                                <div class="col-md-6 mb-3">
                                                    <label class="form-label">
                                                        Last Name
                                                    </label>

                                                    <input type="text"
                                                        class="form-control"
                                                        required>
                                                </div>

                                            </div>


                                            <label class="form-label">Gender</label>

                                            <select class="form-select mb-3" required>

                                                <option selected disabled>Select Gender</option>
                                                <option>Male</option>
                                                <option>Female</option>
                                                <option>Prefer not to say</option>

                                            </select>


                                            <label class="form-label">Email Address</label>

                                            <input type="email"
                                                class="form-control mb-3"
                                                placeholder="name@example.com"
                                                required>


                                            <div class="row">

                                                <div class="col-md-6 mb-3">
                                                    <label class="form-label">
                                                        Password
                                                    </label>

                                                    <input type="password"
                                                        class="form-control"
                                                        required>
                                                </div>

                                                <div class="col-md-6 mb-3">
                                                    <label class="form-label">
                                                        Confirm Password
                                                    </label>

                                                    <input type="password"
                                                        class="form-control"
                                                        required>
                                                </div>

                                            </div>


                                            <div class="form-check mb-3">

                                                <input class="form-check-input"
                                                    type="checkbox"
                                                    id="terms"
                                                    required>

                                                <label class="form-check-label"
                                                    for="terms">
                                                    I agree to the Terms and Conditions.
                                                </label>

                                            </div>


                                            <button type="submit"
                                                    class="btn btn-primary w-100">
                                                Sign Up
                                            </button>

                                        </form>

                                        <p class="text-center mt-3 small">
                                            Already have an account?
                                            <button class="btn btn-link btn-sm p-0"
                                                    data-bs-toggle="pill"
                                                    data-bs-target="#login">
                                                Login
                                            </button>
                                        </p>

                                    </div>
                                </div>
                            </section>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
        </script>

    </body>
</html>
